<body>
  <script>
    // Keep the selected app mode when iOS launches the saved home-screen icon.
    // Some iOS versions reopen the manifest start URL without its original query.
    (function () {
      const url = new URL(window.location.href);
      const requestedMode = url.searchParams.get('mode');
      if (requestedMode === 'photo' || requestedMode === 'draw') {
        localStorage.setItem('cadFieldbookLaunchMode', requestedMode);
        return;
      }
      const standalone = window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
      if (!standalone) return;
      const savedMode = localStorage.getItem('cadFieldbookLaunchMode');
      const iPhone = /iPhone|iPod/i.test(window.navigator.userAgent);
      if (savedMode === 'photo' || iPhone) {
        url.searchParams.set('mode', 'photo');
        window.history.replaceState(null, '', url.toString());
      }
    })();
  </script>
  <script>
    window.cadFieldbookSaveBinaryWithPicker = async function (name, bytes, mimeType) {
      const blob = new Blob([bytes], { type: mimeType });
      const dot = name.lastIndexOf('.');
      const extension = dot >= 0 ? name.substring(dot).toLowerCase() : '';
      if (typeof window.showSaveFilePicker === 'function') {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: name,
            types: [{
              description: extension === '.xlsx' ? 'Excel 写真台帳' : 'ファイル',
              accept: { [mimeType]: extension ? [extension] : [] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        } catch (error) {
          if (error && error.name === 'AbortError') return false;
          // ZIP generation can outlive the short-lived browser user gesture.
          // Fall back to a normal download instead of losing the file.
          console.warn('Save picker unavailable; using download fallback.', error);
        }
      }
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = name;
      anchor.style.display = 'none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
      return true;
    };

    window.cadFieldbookSaveTextWithPicker = async function (name, content, mimeType) {
      const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
      if (typeof window.showSaveFilePicker === 'function') {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: name,
            types: [{
              description: 'DXF図面',
              accept: { 'application/dxf': ['.dxf'] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        } catch (error) {
          if (error && error.name === 'AbortError') return false;
          throw error;
        }
      }
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = name;
      anchor.style.display = 'none';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
      return true;
    };
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.unregister());
      });
    }
  </script>
